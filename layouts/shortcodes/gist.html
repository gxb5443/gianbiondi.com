{{- $user := .Get "user" -}}
{{- $id := .Get "id" -}}
{{- $file := .Get "file" -}}
{{- $src := printf "https://gist.github.com/%s/%s.js" $user $id -}}
{{- if $file -}}
  {{- $src = printf "https://gist.github.com/%s/%s.js?file=%s" $user $id $file -}}
{{- end -}}
<div class="gist-embed">
  <script src="{{ $src }}"></script>
</div>
