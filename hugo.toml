baseURL = "https://gianbiondi.com/"
title = "Gianfranco Biondi"
languageCode = "en"

[params.seo]
[params.seo.person]
name = "Gianfranco Biondi"
url = "https://gianbiondi.com/"
image = "/img/og-preview.png"
sameAs = [
  "https://www.linkedin.com/in/gianfrancobiondi/",
  "https://github.com/gxb5443",
]

[module]
[module.hugoVersion]
# We use hugo.Deps to list dependencies, which was added in Hugo 0.92.0
min = "0.92.0"
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

## Base mounts - so your site's assets are available
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

# The following mounts are required for the theme to be able to load bootstrap
# Remember also to copy the theme's `package.json` to your site, and run `npm install`
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"

## Search & sanitization
[[module.mounts]]
source = "node_modules/fuse.js/dist/fuse.min.js"
target = "static/js/fuse.min.js"

[[module.mounts]]
source = "node_modules/dompurify/dist/purify.min.js"
target = "static/js/purify.min.js"

[params]
title = 'Gianfranco Biondi | Engineering Leader'
description = 'Engineering Leader with over 14 years of experience leading teams and initiatives of all sizesEngineering Leader with over 14 years of experience leading teams and initiatives of all sizes'
images = ['/img/og-img.png']
#sections = [
#  "showcase",
#  "about",
#  "education",
#  "experience",
#  "client-and-work",
#  "testimonial",
#  "contact",
#  "newsletter",
#]
# If you want to display an image logo in the header, you can add it here
# logo = '/img/hugo.svg'

homepageExperienceCount = 4

[params.analytics]
## Analytics parameters.
### Supported so far: Vercel (Page Insights, Analytics)
### And Google (Tag Manager, Analytics)

# controls vercel page insights - disabled by default
# to enable, just set to true
vercelPageInsights = false
vercelAnalytics = false

# google analytics and tag manager. to enable, set "enabled" to true
# and add the tracking code (UA-something for analytics, GTM-something for tag manager)
[params.analytics.googleAnalytics]
code = "UA-XXXXX-Y"
enabled = false
[params.analytics.googleTagManager]
code = "G-WDSC9QQGSH"
enabled = true

[build]
[build.buildStats]
disableClasses = false
disableIDs = false
disableTags = false
enable = true

[outputs]
home = ["HTML", "RSS", "JSON"]

